<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>سوال‌ساز آزمون</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style id="fontcss">
/* compact header editor */
#v-h .in{min-height:38px;padding:5px 10px;border-radius:10px;font-size:14px}
#v-h .grp{padding:10px 12px}
#v-h .grp>*+*{margin-top:6px}
#v-h .pair{gap:5px}
#v-h .pair{grid-template-columns:minmax(0,5fr) minmax(0,6fr) 38px}
#v-h .pair.mid{grid-template-columns:minmax(0,1fr) auto 38px}
#v-h .ibtn{width:38px;height:38px}
#v-h .grp h3{margin:0;font-size:14px}
.hprev{background:var(--deskbg);border-radius:12px;padding:8px;overflow:hidden}
.hprev .hp{background:#fff;color:#000;padding:6px;border-radius:4px;overflow:hidden}
.hprev .sheet{width:194mm}
.pv{padding:6px}
</style>
<style id="sheetcss"></style>
<style>
/* Layout: phone = one screen at a time with a bottom tab bar; wide = editor column beside a live A4 sheet.
   Palette: exam-paper ink. Ballpoint blue for actions, teacher's red pen only for scores and mismatches. */
:root{
  --bg:#eceff5;--surface:#ffffff;--surface2:#f3f5fa;--ink:#142033;--mut:#5b6980;--line:#d8deea;
  --accent:#2646d6;--accent-ink:#ffffff;--accent-soft:#e2e8ff;
  --red:#c4322a;--red-soft:#fdeceb;--ok:#1d8a4b;
  --deskbg:#d5dae6;--shadow:0 1px 2px rgba(20,32,51,.08),0 6px 20px rgba(20,32,51,.08);
  --f-ui:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220;--surface:#161d2d;--surface2:#1d2639;--ink:#e8edf7;--mut:#9aa8c3;--line:#29344f;
  --accent:#8fa6ff;--accent-ink:#0d1220;--accent-soft:#223060;
  --red:#ff8c80;--red-soft:#3b2022;--ok:#59cf8c;--deskbg:#0a0e18;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220;--surface:#161d2d;--surface2:#1d2639;--ink:#e8edf7;--mut:#9aa8c3;--line:#29344f;
  --accent:#8fa6ff;--accent-ink:#0d1220;--accent-soft:#223060;
  --red:#ff8c80;--red-soft:#3b2022;--ok:#59cf8c;--deskbg:#0a0e18;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
[hidden]{display:none!important}

/* ---- app bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;min-height:58px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0;font-weight:800;font-size:19px;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.stamp{border:2px solid var(--ink);border-radius:10px;padding:2px 12px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;transform:rotate(-2deg)}
.stamp.bad{border-color:var(--red);color:var(--red);background:var(--red-soft)}

/* ---- tabs ---- */
.nav{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;border-radius:14px;background:none;color:var(--mut);font-size:12px;font-weight:500}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* ---- views ---- */
.cols{padding-block:16px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:none}
#app[data-tab="q"] #v-q,#app[data-tab="h"] #v-h,#app[data-tab="x"] #v-x,#app[data-tab="p"] #v-p{display:block}
.view>*+*{margin-top:14px}
h2{font-size:17px;font-weight:800;margin:0}
h3{font-size:14px;font-weight:700;margin:0 0 8px;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin:0}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.grp>*+*{margin-top:10px}

/* ---- controls ---- */
.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:8px 12px;color:var(--ink)}
.in:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:78px;line-height:1.8;resize:vertical}
.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);font-weight:500}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.dng{color:var(--red)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:none;color:var(--mut)}
.ibtn svg{width:22px;height:22px}
.ibtn.dng{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr) 44px;gap:6px;align-items:center}
.pair.mid{grid-template-columns:minmax(0,1fr) auto 44px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border-radius:13px;padding:4px}
.seg label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:2px 6px;border-radius:10px;font-size:13px;font-weight:500;color:var(--mut);cursor:pointer;line-height:1.3}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,32,51,.15)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent)}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{inset-inline-start:23px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:13px;background:var(--surface2)}
.stepper button{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:700;color:var(--mut)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.line>span:first-child{font-weight:500}
.line+.line{border-top:1px solid var(--line)}
.fileup{position:relative;overflow:hidden}
.fileup input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* ---- import callout ---- */
.import{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);text-align:start;width:100%}
.import .ic{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.import .ic svg{width:26px;height:26px}
.import b{display:block;font-size:16px;color:var(--ink)}
.import span.s{display:block;font-size:13px;color:var(--mut);line-height:1.5}

/* ---- question cards ---- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:0;background:none;text-align:start}
.qnum{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.qmain{flex:1;min-width:0}
.qtype{display:block;font-size:12px;font-weight:700;color:var(--accent)}
.qsnip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.qscore{color:var(--red);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.qchev{color:var(--mut);transition:transform .15s}
.qcard.open .qchev{transform:rotate(180deg)}
.qbody{padding:4px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.qcard:not(.open) .qbody{display:none}
.types{grid-auto-columns:1fr}
.item{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ihead{display:flex;align-items:center;gap:8px}
.ihead b{font-size:15px}
.score{display:flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--red)}
.score .in{width:78px;text-align:center;font-weight:800;color:var(--red);min-height:40px;background:var(--surface)}
.opt{display:flex;align-items:center;gap:8px}
.opt .in{background:var(--surface)}
.opt .n{width:20px;text-align:center;color:var(--mut);font-weight:700;font-size:13px}
.radio{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.radio:checked{border-color:var(--ok);background:var(--ok)}
.radio:checked::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.thumb{height:44px;width:auto;max-width:90px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:contain}
.flag{font-size:12px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:8px;padding:2px 8px}
.qacts{display:flex;gap:4px;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;border:1.5px dashed var(--line);border-radius:16px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.fab{position:fixed;z-index:24;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
#app:not([data-tab="q"]) .fab{display:none}
.fab svg{width:24px;height:24px}

/* ---- preview ---- */
.ptools{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:var(--bg);border-radius:14px}
.ptools .sp{flex:1;min-width:0}
.ptools .btn.sm{padding:0 11px;min-height:40px}
.ptools .zb{width:40px;padding:0}
.pv{background:var(--deskbg);border-radius:16px;padding:10px;overflow:auto;overscroll-behavior:contain}
.page{width:210mm;height:297mm;padding:8mm;background:#fff;margin:0 auto 12px;box-shadow:0 2px 14px rgba(0,0,0,.25);overflow:hidden;color:#000}
#pages{transform-origin:top center}
#measure{position:fixed;visibility:hidden;pointer-events:none;left:0;top:0;width:194mm;z-index:-1}

/* ---- sheet + toast ---- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,24,.55)}
.sheet-ui{position:fixed;z-index:41;left:0;right:0;bottom:0;margin-inline:auto;width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet-ui::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:104px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);text-align:start}
.tile b{font-size:15px}
.tile .g{font-size:13px;color:var(--mut);letter-spacing:1px;min-height:22px;display:flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mut);display:inline-block}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:112px;padding:14px;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);text-align:center;cursor:pointer;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.bar-prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.toast{position:fixed;z-index:60;inset-inline:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:460px;display:none;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.toast.on{display:flex}
.toast span{flex:1;font-size:14px}
.toast button{border:0;background:none;color:var(--accent);font-weight:800;min-height:36px;padding:0 6px}
:root:not([data-theme="dark"]) .toast button{color:#9db0ff}

/* ---- wide screens ---- */
@media (min-width:1000px){
  .nav{position:static;border:0;background:none;padding:0;gap:6px;width:min(450px,calc(100% - 32px));margin-inline-start:max(16px,env(safe-area-inset-right,0px));margin-top:12px}
  .nav button{flex-direction:row;min-height:44px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
  .nav button[data-t="p"]{display:none}
  .nav button[aria-selected="true"]{border-color:var(--accent)}
  .cols{display:grid;grid-template-columns:minmax(360px,450px) minmax(0,1fr);gap:22px;align-items:start;padding-bottom:48px}
  .col-prev{position:sticky;top:calc(74px + env(safe-area-inset-top,0px))}
  #app .col-prev #v-p{display:block}
  .col-prev .pv{max-height:calc(100vh - 150px)}
  .col-prev .ptools{position:static;padding:0 0 8px}
  .fab{inset-inline-end:auto;inset-inline-start:calc(max(16px,env(safe-area-inset-right,0px)) + 300px);bottom:28px}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" data-tab="q">
  <header class="bar"><div class="bar-in">
    <div class="brand">سوال‌ساز آزمون<small>برگه‌ی امتحانی A4 با بارم‌بندی</small></div>
    <div class="stamp" id="stamp" role="status">بارم ۰</div>
  </div></header>
  <nav class="nav" id="nav" aria-label="بخش‌ها"></nav>
  <main class="cols">
    <div class="col-edit">
      <section class="view" id="v-q">
        <button class="import" id="btn-import" data-act="import" type="button">
          <span class="ic" id="ic-import"></span>
          <span><b>ورود سوال از فایل</b><span class="s">PDF یا عکس برگه‌ی امتحان را بدهید؛ سوال‌ها و بارم‌ها خودکار در همین قالب می‌آیند و بعد قابل ویرایش‌اند.</span></span>
        </button>
        <div id="qs" class="qlist" style="display:flex;flex-direction:column;gap:10px"></div>
      </section>
      <section class="view" id="v-h"></section>
      <section class="view" id="v-x"></section>
    </div>
    <div class="col-prev">
      <section class="view" id="v-p">
        <div class="ptools">
          <button class="btn sm zb" data-act="zoom" data-d="-0.25" aria-label="کوچک‌تر"></button>
          <button class="btn sm" data-act="zoom" data-d="0" id="zfit">متناسب</button>
          <button class="btn sm zb" data-act="zoom" data-d="0.25" aria-label="بزرگ‌تر"></button>
          <span class="sp"></span>
          <button class="btn sm pri" data-act="pdf">PDF</button>
          <button class="btn sm pri" data-act="docx">Word</button>
        </div>
        <div class="pv" id="pv"><div class="sheet" id="pages" dir="rtl"></div></div>
      </section>
    </div>
  </main>
  <button class="fab" id="fab" data-act="addsheet" type="button"></button>
  <div id="measure" class="sheet" dir="rtl"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet-ui" id="sheetui" role="dialog" aria-modal="true" hidden></div>
</div>

<script>
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nl=s=>esc(s).replace(/\n/g,'<br>');
const PD='۰۱۲۳۴۵۶۷۸۹';
const faInt=n=>String(n).replace(/\d/g,d=>PD[d]);
const fa=n=>{n=+n||0;return faInt(String(+n.toFixed(2))).replace('.','/')};
const scTxt=v=>(v===''||v==null)?'':fa(v);
const num=v=>{
 const s=String(v==null?'':v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\/٫,،]/g,'.');
 const n=parseFloat(s);return isNaN(n)?0:n;
};
const hasNum=v=>String(v==null?'':v).trim()!=='';
const LBL=['الف','ب','ج','د','ه','و','ز','ح','ط','ی','ک','ل','م','ن','س','ع'];
const TYPES={essay:'تشریحی',mcq:'چهارگزینه‌ای',tf:'صحیح / غلط',blank:'جای‌خالی'};
const TITLES={essay:'به سؤالات زیر پاسخ کامل دهید.',mcq:'گزینه ی صحیح را مشخص کنید.',tf:'صحیح و غلط بودن جملات زیر را مشخص کنید.',blank:'جاهای خالی را با کلمات مناسب پر کنید.'};

function onField(el){

 if(f==='item'){
  const it=findI(el.dataset.q,el.dataset.i);if(!it)return;
  if(k==='space'){it[k]=hasNum(v)?num(v):''}
  else if(k==='correct'){it.correct=+el.dataset.v}
  else if(k==='opt'){it.options[+el.dataset.v]=v}
  else{it[k]=v;if(k==='text'){const q=findQ(el.dataset.q);const s=$('sn_'+q.id);if(s&&q.items[0]===it)s.textContent=qSnip(q)}}
  qch(false);
 }else if(f==='q'){
  const q=findQ(el.dataset.q);if(!q)return;
  if(k==='type'){q.type=v;qch(true);return}
  if(k==='score'){q.score=hasNum(v)?num(v):'';qch(false);return}
  q[k]=v;if(k==='title'){const s=$('sn_'+q.id);if(s)s.textContent=qSnip(q)}
  qch(k==='optLayout'?false:false);
 }else if(f==='hf'){S[el.dataset.l].find(x=>x.id===el.dataset.id)[k]=v;ch()}
 else if(f==='hm'){S.headMid.find(x=>x.id===el.dataset.id)[k]=v;ch()}
 else if(f==='set'){
  const t=el.dataset.t;
  if(t==='bool')S.set[k]=el.checked;else if(t==='raw')S.set[k]=hasNum(v)?num(v):'';else S.set[k]=v;

}

  let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/w);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));

/* ---------- pagination ---------- */
function paginate(groups,o){
 const m=$('measure');
 const mt=h=>{m.innerHTML=`${TBL}${COLS}${h}</table>`;return m.firstElementChild.offsetHeight};
 const th=p=>thRow(`${o.title} صفحه (${faInt(p)})`);
 let headH=0;if(o.head){m.innerHTML=o.head;headH=m.offsetHeight}
 const H=Math.floor((296-16)*96/25.4)-10;
 const thH=mt(th(1)),fH=o.footer?mt(o.footer):0,gh=groups.map(g=>mt(g));
 const pages=[[]];let used=0,lim=H-headH-thH;
 groups.forEach((g,i)=>{
  if(pages[pages.length-1].length&&used+gh[i]>lim){pages.push([]);used=0;lim=H-thH}
  pages[pages.length-1].push(i);used+=gh[i];
 });
 if(o.footer&&used+fH>lim){const last=pages[pages.length-1];if(last.length>1){pages.push([last.pop()])}else pages.push([])}
 return pages.map((idx,p)=>`<div class="page">${p===0?o.head:''}${TBL}${COLS}${th(p+1)}${idx.map(i=>groups[i]).join('')}${p===pages.length-1?o.footer:''}</table></div>`).join('');
}

/* ---------- PDF export (A4 pages drawn as images) ---------- */
async function pageToCanvas(pageEl,scale){
 const wrap=document.createElement('div');
 wrap.setAttribute('class','sheet');wrap.setAttribute('dir','rtl');
 wrap.setAttribute('style','width:794px;height:1123px;box-sizing:border-box;padding:30.24px;background:#fff;overflow:hidden;color:#000');
 const st=document.createElement('style');st.textContent=fontFaceCss()+sheetCss(false);wrap.appendChild(st);
 const inner=document.createElement('div');inner.innerHTML=pageEl.innerHTML;wrap.appendChild(inner);
 const xml=new XMLSerializer().serializeToString(wrap);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><foreignObject x="0" y="0" width="794" height="1123">${xml}</foreignObject></svg>`;
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg render'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 if(document.fonts&&S.set.fontName){try{await document.fonts.load(`12pt "${S.set.fontName}"`)}catch(e){}}
 const c=document.createElement('canvas');c.width=794*scale;c.height=1123*scale;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
 return c;
}
function makePDF(pages){
 const enc=new TextEncoder(),parts=[],offs=[];let off=0;
 const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);off+=u.length};
 const W=595.28,H=841.89,N=pages.length;
 push('%PDF-1.4\n');
 offs[1]=off;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 offs[2]=off;push(`2 0 obj\n<< /Type /Pages /Count ${N} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>\nendobj\n`);
 pages.forEach((p,i)=>{
  const pg=3+3*i,ct=4+3*i,im=5+3*i,content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  offs[pg]=off;push(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
  offs[ct]=off;push(`${ct} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  offs[im]=off;push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);push(p.bytes);push('\nendstream\nendobj\n');
 });
 const xr=off,total=3+3*N;
 push(`xref\n0 ${total}\n0000000000 65535 f \n`);
 for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'});
}
function exportPDF(){
 return withBusy('در حال ساخت PDF',async()=>{
  clearTimeout(tm);updatePreview();
  const els=[...$('pages').children],out=[];
  for(let i=0;i<els.length;i++){
   prog(i/els.length,`صفحه‌ی ${faInt(i+1)} از ${faInt(els.length)}`);
   const c=await pageToCanvas(els[i],2);
   const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
   out.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:c.width,h:c.height});
   c.width=c.height=0;
  }
  prog(1,'در حال ذخیره…');
  closeSheet(true);
  const ok=await saveFile(makePDF(out),'exam.pdf');
  if(ok)toast('PDF آماده شد.');
 });
}

function impPrompt(a,b,n){

Extract the exam questions and answer with ONE JSON object and nothing else, in exactly this shape:
{"header":{"organization":"","examTitle":"","academicYear":"","subject":"","grade":"","date":"","time":"","teacher":""},
 "questions":[{"type":"essay","title":"","score":0.5,"items":[{"text":"","options":["","","",""],"correct":null,"tf":null,"answer":"","hasFigure":false}]}]}
Rules:
- One entry in "questions" per numbered row (ردیف) of the paper, in order. "title" is that row's instruction line (for example «گزینه ی صحیح را مشخص کنید.»), without the row number.
- If a row has sub-parts (الف، ب، ج، …) make each sub-part one object in "items", with the text WITHOUT the «الف)» label. A row with one question has exactly one item.
- "type": "mcq" = multiple choice with four options (put the options in order 1..4 in "options", without the «1)» numbering); "tf" = true/false statements (ص / غ); "blank" = fill-in-the-blank (keep each blank as "........"); "essay" = everything else. For types other than "mcq" use "options":["","","",""].
- "score" (at row level, next to "title"): ONE number per row = the total score shown in the score column (بارم) for that whole row. Never give a score per sub-part or per option. Convert Persian digits and the slash decimal: ۰/۵ means 0.5, ۱/۵ means 1.5, ۱ means 1. If the sheet prints separate scores for sub-parts, add them together into the row score. If unreadable use null.

}
function fromAI(raw){

  const type=types.includes(q.type)?q.type:'essay';
  const items=(Array.isArray(q.items)&&q.items.length?q.items:[{}]).map(x=>{
   x=x||{};
   const it=newItem({text:String(x.text||'').trim(),answer:String(x.answer||'').trim(),needsImage:!!x.hasFigure});
   if(type==='mcq'){
    const o=Array.isArray(x.options)?x.options.map(s=>String(s==null?'':s).trim()):[];while(o.length<4)o.push('');it.options=o.slice(0,4);
    it.correct=Number.isInteger(x.correct)&&x.correct>=0&&x.correct<4?x.correct:-1;
   }
   if(type==='tf')it.tf=(x.tf==='t'||x.tf===true)?'t':(x.tf==='f'||x.tf===false)?'f':'';
   return it;
  });
  let sc=(q.score==null||q.score==='')?null:num(q.score);
  if(sc==null){const ss=(Array.isArray(q.items)?q.items:[]).filter(x=>x&&x.score!=null&&x.score!=='');sc=ss.length?Math.round(ss.reduce((a,x)=>a+num(x.score),0)*100)/100:''}

  if(type==='mcq'&&Math.max(...items.map(i=>Math.max(...i.options.map(s=>s.length))))>22)nq.optLayout='2';
  return nq;
 });
}

  for(let b=0;b<N;b+=per){
   const bi=b/per;
   impTxt(0.1+0.85*bi/batches,`Claude در حال خواندن صفحه‌ی ${faInt(b+1)}${per>1&&b+per<N?' تا '+faInt(b+per):per>1&&N-b>1?' تا '+faInt(N):''} از ${faInt(N)}…`);
   const r=await sample.json(impPrompt(b+1,Math.min(b+per,N),N),{images:pages.slice(b,b+per),signal:ctl.signal,modelTier:'default'});
   questions.push(...fromAI(r));if(withHead&&r&&r.header&&!header)header=r.header;
   done=Math.min(b+per,N);
  }
  impTxt(1,'');
 }catch(e){
  err=e;impTxt(0,impError(e));
  if(!questions.length){impSetRunning(false);return}
 }
 impSetRunning(false);
 if(!questions.length)return;
 if(replace)S.questions=[];
 S.questions.push(...questions);S.isSample=false;
 if(header)applyHeader(header);
 openQ.clear();
 sheetBusy=false;closeSheet(true);
 renderHdr();renderQs();ch();setTab('q');
 toast(err?`${faInt(questions.length)} سوال وارد شد (بقیه‌ی صفحه‌ها نشد). ${impError(err)}`:`${faInt(questions.length)} سوال وارد شد. متن و بارم‌ها را بررسی کنید.`,'برگرداندن',undo);
}


/* ---------- init ---------- */
function syncAll(){applyFont();renderNav();renderHdr();renderX();renderQs()}
function initAll(){
 $('ic-import').innerHTML=ICON.scan;$('fab').innerHTML=ICON.plus+'<span>سوال جدید</span>';
 document.querySelectorAll('[data-act="zoom"]').forEach(b=>{const d=+b.dataset.d;if(d)b.innerHTML=d>0?ICON.plus:ICON.minus});
 syncAll();setTab(TAB,true);updatePreview();
}
initAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>updatePreview());

</script>
